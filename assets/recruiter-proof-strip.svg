<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 150" role="img" aria-labelledby="title description">
  <title id="title">Selected GTM and Product Growth outcomes</title>
  <desc id="description">Thirteen design partners, twenty-four percent less early-stage abandonment, and twenty-six thousand two hundred seven deal records migrated with zero errors.</desc>

  <rect x="1" y="1" width="1078" height="148" rx="18" fill="#EEEDE8" stroke="#D6D1C7" stroke-width="2"/>
  <rect x="1" y="1" width="7" height="148" rx="3.5" fill="#2F7FB3"/>

  <line x1="360" y1="23" x2="360" y2="127" stroke="#D6D1C7" stroke-width="1"/>
  <line x1="720" y1="23" x2="720" y2="127" stroke="#D6D1C7" stroke-width="1"/>

  <g transform="translate(40 0)">
    <text x="0" y="31" fill="#226AA0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">BUILD</text>
    <rect x="0" y="40" width="38" height="3" rx="1.5" fill="#2F7FB3"/>
    <text x="0" y="91" fill="#26241F" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="600">13</text>
    <text x="71" y="78" fill="#26241F" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">DESIGN PARTNERS</text>
    <text x="71" y="101" fill="#6B655B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">8 at Director level or above</text>
  </g>

  <g transform="translate(400 0)">
    <text x="0" y="31" fill="#226AA0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PROVE</text>
    <rect x="0" y="40" width="38" height="3" rx="1.5" fill="#2F7FB3"/>
    <text x="0" y="91" fill="#26241F" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="600">24%</text>
    <text x="101" y="78" fill="#26241F" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">LESS ABANDONMENT</text>
    <text x="101" y="101" fill="#6B655B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">11 events · 8 funnel stages</text>
  </g>

  <g transform="translate(760 0)">
    <text x="0" y="31" fill="#226AA0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">SCALE</text>
    <rect x="0" y="40" width="38" height="3" rx="1.5" fill="#2F7FB3"/>
    <text x="0" y="91" fill="#26241F" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="600">26,207</text>
    <text x="0" y="119" fill="#26241F" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">DEAL RECORDS MIGRATED</text>
    <text x="0" y="139" fill="#6B655B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Zero errors at POLITICO</text>
  </g>
</svg>
